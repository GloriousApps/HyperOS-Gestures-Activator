plugins {
    id "com.android.application"
}

def releaseKeystoreProperties = new Properties()
def releaseKeystoreFile = rootProject.file("keystore.properties")
if (releaseKeystoreFile.exists()) {
    releaseKeystoreFile.withInputStream { releaseKeystoreProperties.load(it) }
}

def envReleaseStoreFile = System.getenv("HGA_RELEASE_STORE_FILE")
def hasEnvironmentSigning = envReleaseStoreFile != null &&
        System.getenv("HGA_RELEASE_STORE_PASSWORD") != null &&
        System.getenv("HGA_RELEASE_KEY_ALIAS") != null &&
        System.getenv("HGA_RELEASE_KEY_PASSWORD") != null
def hasReleaseSigning = releaseKeystoreFile.exists() || hasEnvironmentSigning
def resolvedVersionName = System.getenv("HGA_VERSION_NAME") ?: "1.2.0"

def gitCommitCount = providers.exec {
    workingDir rootProject.projectDir
    commandLine "git", "rev-list", "--count", "HEAD"
    ignoreExitValue = true
}.standardOutput.asText.map { output ->
    def count = output.trim()
    count.isEmpty() ? 1 : Integer.parseInt(count)
}

android {
    namespace "dev.glorioustr.hyperosgesturesactivator"
    compileSdk 36

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId "dev.glorioustr.hyperosgesturesactivator"
        minSdk 35
        targetSdk 36
        versionCode gitCommitCount.get()
        versionName resolvedVersionName
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile hasEnvironmentSigning
                        ? file(envReleaseStoreFile)
                        : rootProject.file(releaseKeystoreProperties["storeFile"])
                storePassword hasEnvironmentSigning
                        ? System.getenv("HGA_RELEASE_STORE_PASSWORD")
                        : releaseKeystoreProperties["storePassword"]
                keyAlias hasEnvironmentSigning
                        ? System.getenv("HGA_RELEASE_KEY_ALIAS")
                        : releaseKeystoreProperties["keyAlias"]
                keyPassword hasEnvironmentSigning
                        ? System.getenv("HGA_RELEASE_KEY_PASSWORD")
                        : releaseKeystoreProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            versionNameSuffix "-activation"
        }
        release {
            minifyEnabled true
            shrinkResources true
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"),
                    "proguard-rules.pro"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    compileOnly "io.github.libxposed:api:102.0.0"
}
