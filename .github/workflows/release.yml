name: Build & Release HyperOS Gestures Activator

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Release tag (for example v1.2.0)"
        required: true
        default: "v1.2.0"
      publish_release:
        description: "Publish a public GitHub release"
        required: true
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-release:
    name: Build signed APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Resolve release metadata
        id: release_meta
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag_name }}"
          else
            TAG="${{ github.ref_name }}"
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
          echo "title=HyperOS Gestures Activator $TAG" >> "$GITHUB_OUTPUT"

      - name: Restore release signing key
        env:
          HGA_RELEASE_KEYSTORE_BASE64: ${{ secrets.HGA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$HGA_RELEASE_KEYSTORE_BASE64"
          echo "$HGA_RELEASE_KEYSTORE_BASE64" | base64 --decode > release-signing.jks

      - name: Build and lint release APK
        env:
          HGA_VERSION_NAME: ${{ steps.release_meta.outputs.version }}
          HGA_RELEASE_STORE_FILE: ${{ github.workspace }}/release-signing.jks
          HGA_RELEASE_STORE_PASSWORD: ${{ secrets.HGA_RELEASE_STORE_PASSWORD }}
          HGA_RELEASE_KEY_ALIAS: ${{ secrets.HGA_RELEASE_KEY_ALIAS }}
          HGA_RELEASE_KEY_PASSWORD: ${{ secrets.HGA_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease lintRelease --stacktrace

      - name: Verify LSPosed module metadata
        run: |
          unzip -l app/build/outputs/apk/release/app-release.apk | tee apk-contents.txt
          grep -q "META-INF/xposed/java_init.list" apk-contents.txt
          grep -q "META-INF/xposed/module.prop" apk-contents.txt
          grep -q "META-INF/xposed/scope.list" apk-contents.txt

      - name: Prepare release asset
        shell: bash
        run: |
          mkdir -p release-artifacts
          APK="HyperOS-Gestures-Activator-${{ steps.release_meta.outputs.tag }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/$APK"
          cd release-artifacts
          sha256sum "$APK" > "$APK.sha256"

      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperOS-Gestures-Activator-${{ steps.release_meta.outputs.tag }}
          path: release-artifacts/*
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' || inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.title }}
          draft: false
          prerelease: ${{ contains(steps.release_meta.outputs.tag, '-') }}
          generate_release_notes: true
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
