name: Android Build & Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and lint
    if: github.ref_type != 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Build debug APK and run lint
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug lintDebug --stacktrace
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: hyperos-gestures-activator-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload lint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-lint-report
          path: app/build/reports/lint-results-debug.html
          if-no-files-found: warn

  release:
    name: Build signed APK and publish release
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Validate release tag
        id: meta
        shell: bash
        run: |
          TAG="${{ github.ref_name }}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $TAG" >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"
      - name: Restore release signing key
        env:
          HGA_RELEASE_KEYSTORE_BASE64: ${{ secrets.HGA_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$HGA_RELEASE_KEYSTORE_BASE64"
          echo "$HGA_RELEASE_KEYSTORE_BASE64" | base64 --decode > release-signing.jks
      - name: Build and lint signed release APK
        env:
          HGA_VERSION_NAME: ${{ steps.meta.outputs.version }}
          HGA_RELEASE_STORE_FILE: ${{ github.workspace }}/release-signing.jks
          HGA_RELEASE_STORE_PASSWORD: ${{ secrets.HGA_RELEASE_STORE_PASSWORD }}
          HGA_RELEASE_KEY_ALIAS: ${{ secrets.HGA_RELEASE_KEY_ALIAS }}
          HGA_RELEASE_KEY_PASSWORD: ${{ secrets.HGA_RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease lintRelease --stacktrace
      - name: Verify LSPosed module metadata
        run: |
          unzip -l app/build/outputs/apk/release/app-release.apk | tee apk-contents.txt
          grep -q "META-INF/xposed/java_init.list" apk-contents.txt
          grep -q "META-INF/xposed/module.prop" apk-contents.txt
          grep -q "META-INF/xposed/scope.list" apk-contents.txt
      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-artifacts
          APK="HyperOS-Gestures-Activator-${{ steps.meta.outputs.tag }}.apk"
          cp app/build/outputs/apk/release/app-release.apk "release-artifacts/$APK"
          cd release-artifacts
          sha256sum "$APK" > "$APK.sha256"
      - name: Upload signed artifact
        uses: actions/upload-artifact@v4
        with:
          name: HyperOS-Gestures-Activator-${{ steps.meta.outputs.tag }}
          path: release-artifacts/*
          if-no-files-found: error
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: HyperOS Gestures Activator ${{ steps.meta.outputs.tag }}
          draft: false
          prerelease: ${{ contains(steps.meta.outputs.tag, '-') }}
          generate_release_notes: true
          files: release-artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
